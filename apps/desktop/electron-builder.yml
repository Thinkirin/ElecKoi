appId: com.eleckoi.desktop
productName: ElecKoi
copyright: Copyright © ElecKoi

directories:
  output: ../../release

files:
  - out/**/*
  - resources/**/*
  - '!resources/native/**/*'
  - '!node_modules/pnpm/**/*'
  - package.json

extraResources:
  - from: ../../LICENSE
    to: licenses/ElecKoi-LICENSE.txt
  - from: ../../NOTICE
    to: licenses/ElecKoi-NOTICE.txt
  - from: resources/native
    to: native
  - from: node_modules/pnpm
    to: dsh/pnpm
  - from: resources/dsh/node-bin
    to: dsh/node-bin

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/koffi/**/*

npmRebuild: false

publish:
  provider: github
  owner: eleckoi
  repo: ElecKoi
  releaseType: release

win:
  icon: resources/icons/eleckoi-app-icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ElecKoi
  deleteAppDataOnUninstall: false
